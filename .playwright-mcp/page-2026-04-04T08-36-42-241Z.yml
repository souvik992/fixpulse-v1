    - heading "Reliability & Graceful Shutdown" [level=2] [ref=e105]
    - generic [ref=e106]: "// Graceful shutdown — drains in-flight requests function shutdown(signal) { console.log(`[server] ${signal} received — shutting down`); server.close(() => { console.log('[server] HTTP server closed'); process.exit(0); }); // Force exit after 15s if requests don't drain setTimeout(() => process.exit(1), 15_000).unref(); } process.on('SIGTERM', () => shutdown('SIGTERM')); process.on('SIGINT', () => shutdown('SIGINT'));"
    - paragraph [ref=e107]: Without graceful shutdown, a container restart (Kubernetes pod eviction, Render deploy, PM2 reload) immediately kills the process mid-request, causing 502 errors for active users. With this handler, Node waits for all in-flight responses to complete before exiting.
    - heading "Connection Tuning" [level=2] [ref=e108]
    - generic [ref=e109]: // Node.js default keepAliveTimeout is 5s — too short for AWS ALB (60s idle timeout) server.keepAliveTimeout = 65_000; // ms — must exceed load balancer idle timeout server.headersTimeout = 70_000; // must be > keepAliveTimeout
    - paragraph [ref=e110]: Without this fix, AWS ALB / Nginx sends requests on a connection that Node has already closed, resulting in intermittent 502/ECONNRESET errors that increase linearly with traffic.

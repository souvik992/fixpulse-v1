  - generic [ref=e189]:
    - heading "Remaining Architectural Gaps" [level=1] [ref=e190]
    - paragraph [ref=e192]: These items do not block deployment but will become bottlenecks as traffic scales beyond a single-server setup.
    - heading "1. In-Memory Presence Store — Blocks Horizontal Scaling" [level=2] [ref=e193]
    - generic [ref=e194]:
      - generic [ref=e195]: High
      - generic [ref=e196]:
        - strong [ref=e197]: "Impact:"
        - text: If you run two or more Node.js instances (Kubernetes, PM2 cluster), each instance maintains its own presence map. Users connected to instance A are invisible to users on instance B.
    - paragraph [ref=e198]:
      - strong [ref=e199]: "Current code (server.js:22):"
    - generic [ref=e200]: "// Map<orgId, Map<userId, { lastSeen, user }>> const presenceStore = new Map();"
    - paragraph [ref=e201]:
      - strong [ref=e202]: "Fix:"
      - text: Replace with Redis keys using
      - code [ref=e203]: ioredis
      - text: ". Key pattern:"
      - code [ref=e204]: "presence:{orgId}:{userId}"
      - text: ", TTL 60 s, refreshed by heartbeat. Cost: ~1 Redis instance (Upstash free tier works)."
    - heading "2. Images / Files Stored as Base64 in PostgreSQL" [level=2] [ref=e205]
    - generic [ref=e206]:
      - generic [ref=e207]: High
      - generic [ref=e208]:
        - strong [ref=e209]: "Impact:"
        - text: User avatars, org logos, bug attachments, and XLSX data are all base64-encoded and stored in TEXT columns. This inflates row sizes, slows all queries on those tables, and makes DB backups/restores extremely slow at scale.
    - paragraph [ref=e210]:
      - strong [ref=e211]: "Fix:"
      - text: Upload binary files to object storage (AWS S3, Cloudflare R2, or Supabase Storage). Store only the public URL in the DB. Existing data can be migrated with a one-time script.
    - heading "3. XLSX Export Blocks the Event Loop" [level=2] [ref=e212]
    - generic [ref=e213]:
      - generic [ref=e214]: Medium
      - generic [ref=e215]:
        - strong [ref=e216]: "Impact:"
        - text: Generating a large workbook with hundreds of issues is a CPU-synchronous operation. While it runs, no other request can be processed by that Node.js thread.
    - paragraph [ref=e217]:
      - strong [ref=e218]: "Fix:"
      - text: Move
      - code [ref=e219]: exportOrgToXlsxBuffer()
      - text: to a
      - code [ref=e220]: worker_threads
      - text: worker, or push it to a background job queue (BullMQ + Redis). Return a download link when ready instead of streaming inline.
    - heading "4. No Process Clustering" [level=2] [ref=e221]
    - generic [ref=e222]:
      - generic [ref=e223]: Medium
      - generic [ref=e224]:
        - strong [ref=e225]: "Impact:"
        - text: Node.js runs on a single CPU core. A server with 8 cores is using only 12.5% of available CPU capacity.
    - paragraph [ref=e226]:
      - strong [ref=e227]: "Fix (PM2 — recommended):"
    - generic [ref=e228]: "# ecosystem.config.js module.exports = { apps: [{ name: 'bugtracker', script: 'server.js', instances: 'max', // one per CPU core exec_mode: 'cluster', env_production: { NODE_ENV: 'production', PORT: 3000 } }] };"
    - paragraph [ref=e229]: "Note: clustering requires the presence store Redis fix above (items 1 and 4 are linked)."
    - heading "5. No Query Result Caching" [level=2] [ref=e230]
    - generic [ref=e231]:
      - generic [ref=e232]: Low
      - generic [ref=e233]:
        - strong [ref=e234]: "Impact:"
        - text: /api/stats and /api/members hit the database on every page load. At 100 concurrent users, the stats page alone could fire 100 identical aggregate queries per second.
    - paragraph [ref=e235]:
      - strong [ref=e236]: "Fix:"
      - text: Cache results in Redis with a 30–60 second TTL. Invalidate on write (new bug created, member added). A simple in-process
      - code [ref=e237]: Map
      - text: with timestamp can work as a zero-dependency first step.
